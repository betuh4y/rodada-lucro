/* ---------- exportar PDF e Excel ---------- */
var LIBS={
  pdf:["https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js","https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"],
  xlsx:["https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"]
};
function loadScript(src){return new Promise(function(ok,no){
  if(document.querySelector('script[src="'+src+'"]'))return ok();
  var sc=document.createElement("script");sc.src=src;sc.onload=ok;sc.onerror=function(){no(new Error("sem internet para carregar o gerador"))};document.head.appendChild(sc);
})}
function loadLibs(k){return LIBS[k].reduce(function(p,src){return p.then(function(){return loadScript(src)})},Promise.resolve())}
function rel(){
  var dates=periodDates(),T=periodTotals(dates);
  var dias=dates.map(function(d){var x=dayData(d);return {data:brDate(d),dataISO:d,min:x.min,horas:fmtMin(x.min).replace("h",""),km:x.km,cor:x.cor,rec:x.rec,desp:x.desp,fixo:x.fixo,lucro:x.lucro,porHora:x.min?x.rec/(x.min/60):0}});
  var lanc=[];
  dates.forEach(function(d){dayData(d).entries.forEach(function(e){
    lanc.push({data:brDate(d),tipo:e.type==="receita"?"Receita":"Despesa",origem:e.type==="receita"?(APPS[e.app]||APPS.part).nome:(CATS[e.cat]||"Outros"),desc:e.desc||"",cor:e.type==="receita"?(e.corridas||0):"",valor:e.type==="receita"?e.valor:-e.valor});
  })});
  return {dates:dates,T:T,dias:dias,lanc:lanc,titulo:lancLabel(),nome:S.cfg.nome||"",arquivo:"rodada-lucro_"+(dates.length?dates[0]+(dates.length>1?"_a_"+dates[dates.length-1]:""):today())};
}
function plain(t){return String(t).replace(/\u00a0/g," ").replace(/[—–]/g,"-")}
function exportar(tipo,btn){
  var R=rel();
  if(!R.dates.length){toast("Nada para exportar neste período");return}
  var txt=btn.innerHTML;btn.disabled=true;btn.lastChild.textContent=" Gerando…";
  loadLibs(tipo).then(function(){
    return Promise.resolve(tipo==="pdf"?gerarPDF(R):gerarExcel(R)).then(function(){toast(tipo==="pdf"?"PDF gerado":"Excel gerado")});
  }).catch(function(e){toast("Não deu para gerar: "+((e&&e.message)||"erro"))}).then(function(){btn.disabled=false;btn.innerHTML=txt});
}
function gerarPDF(R){
  var doc=new window.jspdf.jsPDF({unit:"pt",format:"a4"});
  var W=doc.internal.pageSize.getWidth(),M=40,T=R.T,y=48;
  var verde=[16,170,98],escuro=[20,27,25],cinza=[110,120,117];
  doc.setFillColor(escuro[0],escuro[1],escuro[2]);doc.rect(0,0,W,86,"F");
  doc.setTextColor(30,232,138);doc.setFont("helvetica","bold");doc.setFontSize(20);doc.text("Rodada Lucro",M,y);
  doc.setTextColor(238,243,241);doc.setFont("helvetica","normal");doc.setFontSize(11);
  doc.text(plain("Relatório de "+R.titulo+(R.nome?"  |  "+R.nome:"")),M,y+20);
  doc.setFontSize(9);doc.setTextColor(170,180,176);doc.text(plain("Gerado em "+brDate(today())+" às "+pad(agoraBR().getHours())+":"+pad(agoraBR().getMinutes())),W-M,y+20,{align:"right"});
  y=116;
  var cards=[["Receitas",money(T.rec)],["Despesas",money(T.desp)],["Custos fixos",money(T.fixo)],["Lucro líquido",(T.lucro<0?"-":"")+money(Math.abs(T.lucro))],
    ["Ganho por hora",T.min?money(T.rec/(T.min/60)):"-"],["Horas",fmtMin(T.min)],["Km rodados",T.km.toFixed(1)+" km"],["Corridas / dias",T.cor+" / "+T.dias]];
  var cw=(W-2*M-30)/4;
  cards.forEach(function(c,i){
    var cx=M+(i%4)*(cw+10),cy=y+Math.floor(i/4)*54;
    doc.setDrawColor(220,226,224);doc.setFillColor(246,248,247);doc.roundedRect(cx,cy,cw,44,6,6,"FD");
    doc.setFontSize(8);doc.setTextColor(cinza[0],cinza[1],cinza[2]);doc.text(c[0].toUpperCase(),cx+10,cy+16);
    doc.setFontSize(12);doc.setFont("helvetica","bold");
    if(i===3){if(T.lucro<0)doc.setTextColor(214,60,66);else doc.setTextColor(verde[0],verde[1],verde[2])}else doc.setTextColor(20,27,25);
    doc.text(plain(c[1]),cx+10,cy+33);doc.setFont("helvetica","normal");
  });
  y+=118;
  doc.setFontSize(12);doc.setTextColor(20,27,25);doc.setFont("helvetica","bold");doc.text("Resumo por dia",M,y);
  doc.autoTable({startY:y+8,margin:{left:M,right:M},theme:"striped",
    head:[["Data","Horas","Km","Corridas","Receita","Despesas","Fixo","Lucro","R$/hora"]],
    body:R.dias.map(function(d){return [d.data,d.horas,d.km.toFixed(1),d.cor,plain(money(d.rec)),plain(money(d.desp)),plain(money(d.fixo)),plain((d.lucro<0?"-":"")+money(Math.abs(d.lucro))),d.porHora?plain(money(d.porHora)):"-"]}),
    foot:[["Total",fmtMin(T.min).replace("h",""),T.km.toFixed(1),T.cor,plain(money(T.rec)),plain(money(T.desp)),plain(money(T.fixo)),plain((T.lucro<0?"-":"")+money(Math.abs(T.lucro))),T.min?plain(money(T.rec/(T.min/60))):"-"]],
    styles:{fontSize:8.5,cellPadding:5},headStyles:{fillColor:escuro,textColor:[30,232,138]},footStyles:{fillColor:[230,246,238],textColor:[20,27,25],fontStyle:"bold"},
    columnStyles:{1:{halign:"right"},2:{halign:"right"},3:{halign:"right"},4:{halign:"right"},5:{halign:"right"},6:{halign:"right"},7:{halign:"right"},8:{halign:"right"}},
    didParseCell:function(h){if(h.section==="body"&&h.column.index===7&&String(h.cell.raw).charAt(0)==="-")h.cell.styles.textColor=[214,60,66]}
  });
  y=doc.lastAutoTable.finalY+26;
  if(y>760){doc.addPage();y=50}
  doc.setFontSize(12);doc.setFont("helvetica","bold");doc.setTextColor(20,27,25);doc.text("Lançamentos",M,y);
  doc.autoTable({startY:y+8,margin:{left:M,right:M},theme:"striped",
    head:[["Data","Tipo","App / categoria","Descrição","Corridas","Valor"]],
    body:R.lanc.map(function(l){return [l.data,l.tipo,plain(l.origem),plain(l.desc),l.cor,plain((l.valor<0?"-":"+")+money(Math.abs(l.valor)))]}),
    styles:{fontSize:8.5,cellPadding:5},headStyles:{fillColor:escuro,textColor:[30,232,138]},
    columnStyles:{4:{halign:"right"},5:{halign:"right",fontStyle:"bold"}},
    didParseCell:function(h){if(h.section==="body"&&h.column.index===5)h.cell.styles.textColor=String(h.cell.raw).charAt(0)==="-"?[214,60,66]:verde}
  });
  var n=doc.internal.getNumberOfPages();
  for(var i=1;i<=n;i++){doc.setPage(i);doc.setFontSize(8);doc.setTextColor(150,158,155);doc.text(plain("Custos fixos: "+money(S.cfg.custoMensal)+" por mês ÷ "+S.cfg.diasTrabalho+" dias de trabalho"),M,doc.internal.pageSize.getHeight()-20);doc.text("Página "+i+" de "+n,W-M,doc.internal.pageSize.getHeight()-20,{align:"right"})}
  if(NATIVE())return salvarArquivo(R.arquivo+".pdf",doc.output("datauristring").split(",")[1]);
  doc.save(R.arquivo+".pdf");
}
function gerarExcel(R){
  var X=window.XLSX,T=R.T,BR='"R$" #,##0.00;[Red]-"R$" #,##0.00';
  function fmt(ws,cols,firstRow,lastRow){cols.forEach(function(c){for(var r=firstRow;r<=lastRow;r++){var a=c+r,cell=ws[a];if(cell&&typeof cell.v==="number")cell.z=BR}})}
  var resumo=[["Rodada Lucro"],["Período",R.titulo],["Motorista",R.nome],["Gerado em",brDate(today())],[],
    ["Receitas",T.rec],["Despesas",T.desp],["Custos fixos",T.fixo],["Lucro líquido",T.lucro],["Ganho por hora",T.min?T.rec/(T.min/60):0],
    ["Horas trabalhadas",fmtMin(T.min).replace("h","")],["Km rodados",T.km],["Corridas",T.cor],["Dias trabalhados",T.dias],[],["Custos fixos mensais"]];
  var fx0=resumo.length+1;
  (S.cfg.fixos||[]).forEach(function(f){resumo.push([f.nome,f.valor])});
  resumo.push(["Total por mês",S.cfg.custoMensal],["Dias de trabalho no mês",S.cfg.diasTrabalho]);
  var ck=custoKm();if(ck.ok){var TT=Object.assign({dates:R.dates},T),LR=lucroReal(TT);resumo.push([],["Custo por km",ck.total],["Custo do km rodado",LR.custoRodado],["Lucro real",LR.lucro],["Lucro real por km",LR.porKm])}
  var ws1=X.utils.aoa_to_sheet(resumo);fmt(ws1,["B"],6,10);fmt(ws1,["B"],fx0,resumo.length);
  var dt=resumo.findIndex(function(x){return x[0]==="Dias de trabalho no mês"});if(dt>-1&&ws1["B"+(dt+1)])delete ws1["B"+(dt+1)].z;ws1["!cols"]=[{wch:20},{wch:22}];
  var dh=[["Data","Horas","Km","Corridas","Receita","Despesas","Custo fixo","Lucro","Ganho por hora"]];
  R.dias.forEach(function(d){dh.push([d.data,d.horas,d.km,d.cor,d.rec,d.desp,d.fixo,d.lucro,d.porHora])});
  dh.push(["Total",fmtMin(T.min).replace("h",""),T.km,T.cor,T.rec,T.desp,T.fixo,T.lucro,T.min?T.rec/(T.min/60):0]);
  var ws2=X.utils.aoa_to_sheet(dh);fmt(ws2,["E","F","G","H","I"],2,dh.length);
  ws2["!cols"]=[{wch:12},{wch:8},{wch:8},{wch:9},{wch:13},{wch:13},{wch:13},{wch:13},{wch:15}];ws2["!autofilter"]={ref:"A1:I"+(dh.length-1)};
  var lh=[["Data","Tipo","App / categoria","Descrição","Corridas","Valor"]];
  R.lanc.forEach(function(l){lh.push([l.data,l.tipo,l.origem,l.desc,l.cor,l.valor])});
  var ws3=X.utils.aoa_to_sheet(lh);fmt(ws3,["F"],2,lh.length);
  ws3["!cols"]=[{wch:12},{wch:10},{wch:20},{wch:28},{wch:9},{wch:13}];ws3["!autofilter"]={ref:"A1:F"+lh.length};
  var wb=X.utils.book_new();
  X.utils.book_append_sheet(wb,ws1,"Resumo");X.utils.book_append_sheet(wb,ws2,"Por dia");X.utils.book_append_sheet(wb,ws3,"Lançamentos");
  if(NATIVE())return salvarArquivo(R.arquivo+".xlsx",X.write(wb,{bookType:"xlsx",type:"base64"}));
  X.writeFile(wb,R.arquivo+".xlsx");
}
